{% set name = "us" %}
{% set version = "4.0.0" %}
{% set bundle = "tar.gz" %}
{% set hash = "7dd4c4e603c9427b72d7e07be700d8f643bdcd7f5195a12bc639f1b7e38e7496" %}
{% set build = 0 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ bundle }}
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ bundle }}
  sha256: {{ hash }}

build:
  noarch: python
  entry_points:
    - states = us.cli.states:main
  number: {{ build }}
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - jellyfish ==0.11.2
    - setuptools

test:
  requires:
    - python {{ python_min }}
  imports:
    - us
    - us.cli

  commands:
    - states --help

about:
  home: https://github.com/unitedstates/python-us
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: US state meta information and other fun stuff
  dev_url: https://github.com/unitedstates/python-us

extra:
  recipe-maintainers:
    - raybellwaves
    - pmlandwehr
    - dorisjlee
